<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>고객정보 입력 - 계약서 작성</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#1c2733;--mute:#6b7785;--line:#dde3ea;--pri:#0f766e;--pri2:#0b5c56;--warn:#b45309}
*{box-sizing:border-box}
body{margin:0;font-family:"Malgun Gothic",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
header{background:#12303a;color:#fff;padding:12px 24px;display:flex;align-items:center;gap:16px}
header h1{font-size:24px;margin:0}
header .steps{margin-left:auto;display:flex;gap:6px;font-size:12px}
header .steps span{padding:3px 10px;border-radius:12px;background:#ffffff22}
header .steps span.on{background:#14b8a6;color:#04201d;font-weight:700}
main{display:grid;grid-template-columns:400px 1fr;gap:16px;padding:16px;height:calc(100vh - var(--hh,92px))}
#form{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;overflow:auto}
#form h2{font-size:13px;color:var(--pri);margin:16px 0 8px;border-bottom:1px solid var(--line);padding-bottom:4px}
#form h2:first-child{margin-top:0}
.row{display:grid;grid-template-columns:92px 1fr;gap:8px;align-items:center;margin-bottom:7px}
.row label{color:var(--mute);font-size:12.5px}
.row.two{grid-template-columns:92px 1fr 56px 1fr}
.row.two .l2{text-align:right}
input[type=text],input[type=number],input[type=date],input[type=tel],input[type=email],select{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;font:inherit;background:#fff;min-width:0}
input:focus,select:focus{outline:2px solid #14b8a655;border-color:var(--pri)}
.seg{display:flex;gap:6px;margin-bottom:6px}
.seg label{flex:1;text-align:center;padding:8px 4px;border:1px solid var(--line);border-radius:8px;cursor:pointer;font-size:13px}
.seg input{display:none}
.seg label:has(input:checked){background:var(--pri);color:#fff;border-color:var(--pri);font-weight:700}
.hint{font-size:11.5px;color:var(--mute);margin:-3px 0 8px 100px}
.btns{display:flex;gap:8px;margin-top:16px;position:sticky;bottom:-14px;background:var(--card);padding:10px 0 4px}
button{padding:10px 12px;border:0;border-radius:8px;font:inherit;font-weight:700;cursor:pointer;background:var(--pri);color:#fff;flex:1}
button:hover{background:var(--pri2)}
button.sub{background:#e5eaf0;color:var(--ink)}
button.sub:hover{background:#d5dde6}
#pv{background:#8a949e;border:1px solid var(--line);border-radius:10px;overflow:auto;padding:12px}
#pv .docx-wrapper{background:transparent!important;padding:0!important}
#msg{white-space:pre-line;font-size:12px;color:var(--warn);margin-top:8px;min-height:16px}
.hide{display:none!important}
@media print{
  @page{size:A4;margin:0}
  body{background:#fff}
  header,#form,#topBtns,#btnXls,#zoomBox{display:none!important}
  main{display:block;padding:0;height:auto}
  #pv{border:0;padding:0;background:#fff;overflow:visible}
  #pv .docx-wrapper{padding:0!important;background:#fff!important}
  #pv .docx-wrapper>section.docx{box-shadow:none!important;margin:0!important;break-after:page;padding-bottom:20px!important}
  #pv .docx-wrapper>section.docx:last-child{break-after:auto}
}
textarea{width:100%;padding:6px 8px;border:1px dashed #94a3b8;border-radius:6px;font:inherit;resize:vertical;background:#f8fafc}
textarea.drag{border-color:var(--pri);background:#ecfdf5}
.mrow{display:flex;align-items:center;gap:6px}.mrow input{width:52px!important;text-align:center}.mbtn{padding:5px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;cursor:pointer;font:inherit;font-size:12.5px}.mbtn{background:var(--pri);color:#fff;border-color:var(--pri);}.mbtn:hover{filter:brightness(1.15)}.mbtn.on{font-weight:700;box-shadow:0 0 0 2px #fff,0 0 0 4px var(--pri)}
.hint{font-size:12px;color:#0f766e;margin:-2px 0 6px 0;min-height:0}.hint:empty{display:none}.hint.warn{color:#b45309}
#topBtns{position:fixed;right:34px;top:calc(var(--hh,63px) + 26px);z-index:50;display:flex;gap:8px}#btnXls{position:fixed;right:34px;bottom:26px;z-index:50}#btnNew,#btnXls,#btnOb{flex:none;padding:10px 18px;border-radius:24px;border:0;background:#12303a;color:#fff;font:inherit;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.35);text-decoration:none;white-space:nowrap}#btnXls:hover{background:var(--pri)}#zoomBox{position:fixed;right:34px;bottom:75px;z-index:50;display:flex;align-items:center;border-radius:24px;background:#12303a;box-shadow:0 4px 14px rgba(0,0,0,.35);overflow:hidden}#zoomBox button{flex:none;height:31px;padding:0 14px;border-radius:0;background:transparent;font-size:15px;line-height:1}#zoomBox button:hover{background:var(--pri)}#zoomBox #zVal{min-width:62px;font-size:13px;border-left:1px solid #ffffff33;border-right:1px solid #ffffff33}#btnNew{background:#fff;color:#0f766e;border:1px solid #99d5cd}#btnNew:hover{background:#ecfdf5}#btnOb{margin-left:auto;background:#14b8a6;color:#04201d;box-shadow:none}#btnOb:hover{background:#2dd4bf}#btnNew,#btnOb{height:31px;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;line-height:1;font-size:13px}
#ov{position:fixed;inset:0;z-index:999;display:none;align-items:center;justify-content:center;background:rgba(15,23,42,.45);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
#ov.on{display:flex}
#ovCard{background:#fff;border-radius:14px;padding:22px 26px;min-width:300px;max-width:520px;box-shadow:0 10px 40px rgba(0,0,0,.3);text-align:center}
#ovCard h3{margin:0 0 10px;font-size:17px}#ovCard .ovb{font-size:14px;line-height:1.55;text-align:left;margin-bottom:14px;max-height:50vh;overflow:auto}
#ovCard table{border-collapse:collapse;width:100%;font-size:13px;margin:8px 0}#ovCard td,#ovCard th{border:1px solid var(--line);padding:4px 8px}#ovCard th{background:#f1f5f9}
.spin{width:38px;height:38px;border:4px solid #cbd5e1;border-top-color:var(--pri);border-radius:50%;margin:4px auto 12px;animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
#ovBtns{display:flex;gap:8px;justify-content:center}
.btns{flex-wrap:wrap}button.danger{background:#fee2e2;color:#b91c1c;border:1px solid #fecaca}button.danger:hover{background:#fecaca}
.pbtns{display:flex;gap:6px;margin:6px 0}.pbtns button{padding:6px 8px;font-size:12.5px}
.inl{font-weight:400;color:var(--ink);margin-left:10px;cursor:pointer}.inl input{vertical-align:-2px}
</style>
</head>
<body>
<header>
  <h1>정원오피스넷 고객정보 입력</h1>
  <a id="btnOb" href="https://jw-officenet.onrender.com" target="_blank" rel="noopener" title="officeboard 사이트 열기">🏢 Officeboard</a>
</header>
<main>
<section id="form">
  <h2>카톡 내용 붙여넣기 (비상주)</h2>
  <textarea id="paste" rows="5" placeholder="고객이 보낸 카톡 내용을 여기에 붙여넣기(Ctrl+V)하거나 끌어다 놓으세요. 화면 어디서든 붙여넣어도 됩니다."></textarea>
  <div class="pbtns"><button id="btnTpl" class="sub" type="button">고객용 양식 복사</button><button id="btnApply" class="sub" type="button">입력 반영</button></div>
  <div class="hint" id="pasteInfo" style="margin-left:0"></div>

  <h2>계약 종류</h2>
  <div class="seg" id="typeSeg">
    <label><input type="radio" name="type" value="resident" checked>상주</label>
    <label><input type="radio" name="type" value="virtual">비상주</label>
  </div>

  <h2>을(고객) 정보 <label class="inl"><input type="checkbox" id="isCorp"> 법인</label></h2>
  <div class="row"><label id="lbCompany">상호</label><input type="text" id="company"></div>
  <div class="row"><label>대표자(성명)</label><input type="text" id="rep"></div>
  <div class="row"><label>주소</label><input type="text" id="addr"></div>
  <div class="row"><label id="lbBiz">사업자번호</label><input type="text" id="bizNo" placeholder="000-00-00000"></div>
  <div class="row" id="rowCorpNo"><label id="lbCorpNo">법인등록번호</label><input type="text" id="corpNo"></div>
  <div class="row"><label>연락처</label><input type="tel" id="phone" placeholder="010-0000-0000"></div>
  <div class="row"><label>이메일</label><input type="email" id="email"></div>

  <h2>계약 내용</h2>
  <div class="row"><label>호실</label><input type="text" id="room" placeholder="예: A01 / G01 / D15"></div>
  <div id="roomHint" class="hint"></div>
  <div class="row"><label>시작일</label><input type="date" id="start"></div>
  <div class="row"><label>계약 개월수</label><div class="mrow"><input type="number" id="months" min="1" max="99" value="12"><span>개월</span><button type="button" class="mbtn" data-m="1">1</button><button type="button" class="mbtn" data-m="3">3</button><button type="button" class="mbtn" data-m="6">6</button><button type="button" class="mbtn" data-m="12">12</button></div></div>
  <div class="row"><label>종료일</label><input type="date" id="end"></div>
  <div class="row"><label>계약 작성일</label><input type="date" id="signDate"></div>

  <div id="gResident">
    <div class="row"><label>납부일(매월)</label><input type="number" id="payDay" min="1" max="31" placeholder="일"></div>
    <h2>금액 (월, VAT 별도 기준)</h2>
    <div class="row"><label>표준금액</label><input type="text" id="stdFee" inputmode="numeric"></div>
    <div class="row"><label>할인금액</label><input type="text" id="discFee" inputmode="numeric"></div>
    <div class="row"><label>보증금</label><input type="text" id="deposit" inputmode="numeric"></div>
    <div class="hint">보증금 기본값: 표준금액의 2개월분 (직접 수정 가능)</div>
    <h2>집기 수량</h2>
    <div class="row two"><label>의자</label><input type="number" id="qChair" min="0" value="1"><label class="l2">책상</label><input type="number" id="qDesk" min="0" value="1"></div>
    <div class="row two"><label>선반</label><input type="number" id="qShelf" min="0" value="1"><label class="l2">서랍장</label><input type="number" id="qDrawer" min="0" value="1"></div>
    <div class="row"><label>도어락</label><input type="number" id="qLock" min="0" value="1"></div>
  </div>

  <div id="gVirtual" class="hide">
    <div class="row"><label>임대료 선납</label><input type="checkbox" id="prepaid" checked style="width:auto;justify-self:start"></div>
    <div class="hint" id="feeInfo" style="margin-left:0"></div>
  </div>

  <h2>파일</h2>
  <div class="row"><label>파일 제목</label><input type="text" id="fname"></div>
  <div id="msg"></div>
  <div class="btns">
    <button id="btnPdf">PDF 저장</button>
    <button id="btnDocx" class="sub">Word 저장</button>
    <button id="btnCancel" class="danger" title="방금 등록한 고객을 고객list·officeboard에서 지웁니다">등록 취소</button>
  </div>
</section>
<div id="topBtns"><button id="btnNew" title="입력한 내용을 모두 지우고 새 화면으로 시작">🆕 새 화면</button></div>
<div id="zoomBox"><button type="button" id="zIn" title="확대">+</button><button type="button" id="zVal" title="클릭하면 100%로">100%</button><button type="button" id="zOut" title="축소">−</button></div>
<button id="btnXls" title="고객list 엑셀 파일 열기">📊 고객list 엑셀 열기</button>
<div id="ov"><div id="ovCard"></div></div>
<section id="pv"><div id="doc"></div></section>
</main>

<script src="lib/jszip.min.js"></script>
<script src="lib/docx-preview.min.js"></script>
<script src="templates.js"></script>
<script>
"use strict";
const W = "http://schemas.openxmlformats.org/wordprocessingml/2006/main";
const $ = id => document.getElementById(id);

/* ---------- 숫자/날짜 유틸 ---------- */
const num = s => parseInt(String(s||"").replace(/[^\d]/g,""),10) || 0;
const fmt = n => n.toLocaleString("ko-KR");
function korAmount(n){
  if(!n) return "";
  const dg="영일이삼사오육칠팔구".split(""), sm=["","십","백","천"], big=["","만","억","조"];
  let out="", g=0;
  while(n>0){
    const part=n%10000; n=Math.floor(n/10000);
    if(part){
      let s="";
      for(let i=3;i>=0;i--){
        const d=Math.floor(part/10**i)%10;
        if(d) s += (d===1&&i>0?"":dg[d]) + sm[i];
      }
      out = s + big[g] + out;
    }
    g++;
  }
  return out;
}
const pad = n => String(n).padStart(2,"0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
function parseIso(s){ const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||""); return m?new Date(+m[1],+m[2]-1,+m[3]):null; }
function calcEnd(start, months){
  const d=parseIso(start); if(!d||!months) return "";
  const t=new Date(d.getFullYear(), d.getMonth()+months, 1);
  const last=new Date(t.getFullYear(), t.getMonth()+1, 0).getDate();
  t.setDate(Math.min(d.getDate(), last));
  t.setDate(t.getDate()-1);
  return iso(t);
}
const ymd = s => { const d=parseIso(s); return d?{y:d.getFullYear(), m:d.getMonth()+1, d:d.getDate()}:{y:"",m:"",d:""}; };

/* ---------- docx XML 편집 도구 ---------- */
const q = (el, name) => Array.from(el.children).filter(c => c.localName===name && c.namespaceURI===W);
function tNodes(p){ return Array.from(p.getElementsByTagNameNS(W,"t")); }
function paraText(p){ return tNodes(p).map(t=>t.textContent).join(""); }
let HL=false;   // 미리보기에서만, 바뀌는 글자에 노란 음영
const XMLNS="http://www.w3.org/XML/1998/namespace";
function setT(t, text){ t.textContent=text; t.setAttributeNS(XMLNS,"xml:space","preserve"); }
function setHL(r, on){            // run 의 음영을 항상 먼저 지우고, 필요할 때만 노랑
  if(!r || r.localName!=="r") return;
  let rp=q(r,"rPr")[0];
  if(rp) q(rp,"highlight").forEach(h=>rp.removeChild(h));
  if(on){
    if(!rp){ rp=r.ownerDocument.createElementNS(W,"w:rPr"); r.insertBefore(rp,r.firstChild); }
    const h=r.ownerDocument.createElementNS(W,"w:highlight"); h.setAttributeNS(W,"w:val","yellow"); rp.appendChild(h);
  }
}
function cloneRun(r, text, hl){   // r 의 서식을 복사한 새 run
  const c=r.cloneNode(true), ts=c.getElementsByTagNameNS(W,"t");
  setT(ts[0], text);
  for(let i=1;i<ts.length;i++) ts[i].parentNode.removeChild(ts[i]);
  setHL(c, hl);
  return c;
}
function replaceRange(p, start, end, text){   // [start,end) 를 text 로 바꾸고 text 부분만 음영
  let pos=0, placed=false;
  for(const t of tNodes(p)){
    const s=t.textContent, a=pos, b=pos+s.length; pos=b;
    if(b<=start || a>=end) continue;
    const ls=Math.max(start,a)-a, le=Math.min(end,b)-a, r=t.parentNode;
    const pre=s.slice(0,ls), suf=s.slice(le);
    if(r.localName==="r"){
      if(pre) r.parentNode.insertBefore(cloneRun(r,pre,false), r);
      if(suf) r.parentNode.insertBefore(cloneRun(r,suf,false), r.nextSibling);
    }
    setT(t, placed?"":text);
    setHL(r, HL && !placed && text!=="");
    placed=true;
  }
  return placed;
}
function makeRun(p){
  const doc=p.ownerDocument, r=doc.createElementNS(W,"w:r");
  const ppr=q(p,"pPr")[0], prpr=ppr&&q(ppr,"rPr")[0];
  if(prpr){ const rp=doc.createElementNS(W,"w:rPr"); Array.from(prpr.children).forEach(c=>{ if(!["ins","del","moveFrom","moveTo"].includes(c.localName)) rp.appendChild(c.cloneNode(true)); }); r.appendChild(rp); }
  const t=doc.createElementNS(W,"w:t"); r.appendChild(t); p.appendChild(r); return r;
}
// 문단 전체를 조각으로 다시 씀: 문자열=그대로, {v:값}=바뀌는 부분(음영)
function setSegs(p, segs){
  if(!p) return;
  if(!tNodes(p).length){ if(!segs.some(s=>typeof s==="string"?s:s.v)) return; makeRun(p); }
  const ts=tNodes(p), r0=ts[0].parentNode;
  ts.slice(1).forEach(t=>{ setT(t,""); setHL(t.parentNode,false); });
  for(const s of segs){
    const isV=typeof s!=="string", txt=String(isV?s.v:s);
    if(txt==="") continue;
    r0.parentNode.insertBefore(cloneRun(r0, txt, HL&&isV), r0);
  }
  r0.parentNode.removeChild(r0);
}
function setPara(p, text){ setSegs(p, [{v:text}]); }
function fillBlanks(p, values){      // 문단 안의 ___ 빈칸을 순서대로 채움
  if(!p) return;
  for(const v of values){
    const m=/_+/.exec(paraText(p)); if(!m) break;
    replaceRange(p,m.index,m.index+m[0].length,String(v));
  }
}
function replaceText(p, from, to){
  if(!p) return;
  const i=paraText(p).indexOf(from); if(i>=0) replaceRange(p,i,i+from.length,to);
}
const bodyKids = doc => Array.from(doc.getElementsByTagNameNS(W,"body")[0].children);
function tableAt(doc, ti){ return bodyKids(doc).filter(e=>e.localName==="tbl")[ti]; }
function cellP(doc, ti, r, c, pi=0){
  const tbl=tableAt(doc,ti); if(!tbl) return null;
  const tr=q(tbl,"tr")[r]; if(!tr) return null;
  const tc=q(tr,"tc")[c]; if(!tc) return null;
  return q(tc,"p")[pi]||null;
}
function bodyParas(doc){ return bodyKids(doc).filter(e=>e.localName==="p"); }
function findPara(doc, startsWith){ return bodyParas(doc).find(p=>paraText(p).replace(/\s/g,"").startsWith(startsWith.replace(/\s/g,""))); }

/* ---------- 폼 값 ---------- */
const STD_FEE = 100000;                    // 비상주 표준금액(월, VAT 별도)
const DISC_FEE = {indiv:15000, corp:20000}; // 비상주 할인 후 금액(월, VAT 별도)
function vals(){
  const g=id=>$(id).value.trim();
  const type=document.querySelector('input[name=type]:checked').value;   // resident | virtual
  const corp=$("isCorp").checked, months=num(g("months")), prepaid=$("prepaid").checked;
  const v={
    type, corp, company:g("company"), rep:g("rep"), addr:g("addr"), bizNo:g("bizNo"), corpNo:g("corpNo"),
    phone:g("phone"), email:g("email"), room:g("room"),
    start:g("start"), months, end:g("end"), sign:g("signDate")||iso(new Date()), prepaid
  };
  if(type==="virtual"){
    v.std=STD_FEE; v.disc=DISC_FEE[corp?"corp":"indiv"];
    v.total = prepaid ? Math.round(v.disc*months*1.1) : 0;      // 잔금(VAT 포함 총액)
  }else{
    v.std=num(g("stdFee")); v.disc=num(g("discFee")); v.deposit=num(g("deposit")); v.payDay=g("payDay");
    v.q=[g("qChair"),g("qDesk"),g("qShelf"),g("qDrawer"),g("qLock")];
  }
  return v;
}

/* ---------- 계약서 채우기 ---------- */
const mo2 = m => String(m).padStart(2," ");   // 7월도 10월처럼 두 글자 폭으로 음영
function fillResident(doc, v){
  const s=ymd(v.start), e=ymd(v.end), sg=ymd(v.sign), yy=n=>String(n).slice(2);
  const name = v.company || v.rep, vat = n => Math.round(n*1.1);
  setSegs(findPara(doc,"을 :"), ["을 : ", {v:name}]);
  fillBlanks(findPara(doc,"위 갑과 을은"), [yy(sg.y), mo2(sg.m), sg.d]);
  fillBlanks(findPara(doc,"본 계약의 계약기간은"), [yy(s.y), mo2(s.m), s.d]);
  fillBlanks(bodyParas(doc).find(p=>paraText(p).includes("입주 만료일")), [yy(e.y), mo2(e.m), e.d]);
  fillBlanks(cellP(doc,0,1,1), [v.room]);
  v.q.forEach((n,i)=>fillBlanks(cellP(doc,0,2,1,i), [n]));
  fillBlanks(cellP(doc,1,1,1,0), [fmt(v.std)]);   fillBlanks(cellP(doc,1,1,1,1), [fmt(vat(v.std))]);

function centerStamp(doc){   // 정원유니어스 도장: '(인)' 글자 한가운데에 겹쳐 찍기 (글자는 도장 위에 보임)
  const WP="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing";
  const a=Array.from(doc.getElementsByTagNameNS(WP,"anchor")).find(x=>{ const d=x.getElementsByTagNameNS(WP,"docPr")[0]; return d&&d.getAttribute("name")==="그림 2"; });
  if(!a) return;
  const ext=a.getElementsByTagNameNS(WP,"extent")[0], cy=+ext.getAttribute("cy");
  const mk=(tag,rel,inner)=>{ const e=doc.createElementNS(WP,"wp:"+tag); e.setAttribute("relativeFrom",rel); const c=doc.createElementNS(WP,"wp:"+inner[0]); c.textContent=inner[1]; e.appendChild(c); return e; };
  const h=a.getElementsByTagNameNS(WP,"positionH")[0], vv=a.getElementsByTagNameNS(WP,"positionV")[0];
  h.parentNode.replaceChild(mk("positionH","column",["align","center"]), h);
  vv.parentNode.replaceChild(mk("positionV","paragraph",["posOffset",String(Math.round((190500-cy)/2))]), vv);
}

async function buildDocx(v, hl=false){
  HL=hl;
  const zip = await JSZip.loadAsync(window.TEMPLATES[v.type], {base64:true});
  const xml = await zip.file("word/document.xml").async("string");
  const doc = new DOMParser().parseFromString(xml, "application/xml");
  if(doc.getElementsByTagName("parsererror").length) throw new Error("계약서 XML 읽기 실패");
  // 양식에 원래 있던 노란 음영(빈칸 표시)은 모두 제거 → 이후 바뀌는 글자에만 음영
  Array.from(doc.getElementsByTagNameNS(W,"highlight")).forEach(h=>h.parentNode.removeChild(h));
  (v.type==="resident" ? fillResident : fillVirtual)(doc, v);
  const out = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' + new XMLSerializer().serializeToString(doc).replace(/^<\?xml[^>]*\?>\s*/, "");
  zip.file("word/document.xml", out);
  return zip.generateAsync({type:"blob", mimeType:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"});
}

const FORM_TEMPLATE = [
  "[정원오피스넷 비상주 계약 정보]",
  "아래 항목을 채워서 보내주세요.(없으면 비워주세요)",

const NUM_KEYS = ["company","rep","bizNo","corpNo","addr","phone","email","start","months"];
const KEY_LABEL = {company:"상호",rep:"대표자",bizNo:"사업자·주민번호",corpNo:"법인등록번호",addr:"주소",phone:"연락처",email:"이메일",start:"시작일",months:"개월수"};
const KEY_RE = [   // 순서 중요(구체적인 것 먼저)
  ["corpNo",/법인\s*(등록)?\s*번호/],["bizNo",/사업자|주민/],["email",/메일|e-?mail/i],
  ["phone",/연락처|전화|휴대폰|핸드폰|H\.?\s?P/i],["addr",/주소|소재지/],
  ["months",/기간|개월/],["start",/시작|희망|입주/],["company",/상호|법인명|회사|업체/],["rep",/대표|성명|이름/]
];
const keyOfLabel = s => { for(const [k,re] of KEY_RE) if(re.test(s)) return k; return null; };
const digits = s => String(s||"").replace(/\D/g,"");
function normVal(k, v){
  v=v.trim().replace(/^["'“”‘’]+|["'“”‘’]+$/g,"").trim();
  const d=digits(v);
  if(k==="phone"){ if(d.length===11) return `${d.slice(0,3)}-${d.slice(3,7)}-${d.slice(7)}`;
    if(d.length===10) return d.startsWith("02") ? `${d.slice(0,2)}-${d.slice(2,6)}-${d.slice(6)}` : `${d.slice(0,3)}-${d.slice(3,6)}-${d.slice(6)}`; return v; }
  if(k==="bizNo"){ if(d.length===10) return `${d.slice(0,3)}-${d.slice(3,5)}-${d.slice(5)}`; if(d.length===13) return `${d.slice(0,6)}-${d.slice(6)}`; return v; }
  if(k==="corpNo"){ return d.length===13 ? `${d.slice(0,6)}-${d.slice(6)}` : v; }
  if(k==="email"){ const m=/[^\s@<>()]+@[^\s@<>()]+\.[^\s@<>()]+/.exec(v); return m?m[0]:v; }
  return v;
}
function parseDateKo(s){
  let m, y, mo, d;
  if((m=/(\d{4})\s*[.\-\/년]\s*(\d{1,2})\s*[.\-\/월]\s*(\d{1,2})/.exec(s))){ y=+m[1]; mo=+m[2]; d=+m[3]; }
  else if((m=/(\d{2})\s*[.\-\/]\s*(\d{1,2})\s*[.\-\/]\s*(\d{1,2})/.exec(s))){ y=2000+ +m[1]; mo=+m[2]; d=+m[3]; }
  else if((m=/(\d{1,2})\s*[월\/.\-]\s*(\d{1,2})/.exec(s))){
    mo=+m[1]; d=+m[2]; const now=new Date(); y=now.getFullYear();
    if(new Date(y,mo-1,d) < new Date(now.getTime()-30*864e5)) y++;
  } else return "";
  return (mo>=1&&mo<=12&&d>=1&&d<=31) ? `${y}-${pad(mo)}-${pad(d)}` : "";
}
function parseKakao(text){
  const out={}, lines=String(text||"").replace(/\r/g,"").split("\n");
  let last=null;
  for(let raw of lines){
    let line=raw.replace(/^\s*\[[^\]]+\]\s*\[(오전|오후)\s*\d{1,2}:\d{2}\]\s*/,"").trim();   // 카톡 [이름] [오후 3:21] 머리말 제거
    if(!line) continue;
    let key=null, val=null, m;
    if((m=/^([1-9])\s*[.)．]\s*(.*)$/.exec(line))){
      const n=+m[1], rest=m[2], ci=rest.search(/[:：]/);
      if(ci>=0){ key=keyOfLabel(rest.slice(0,ci)) || NUM_KEYS[n-1]; val=rest.slice(ci+1); }
      else { key=NUM_KEYS[n-1]; val=rest.replace(/^(상호\(법인명\)|상호|법인명|대표자\s*성명|대표자|사업자등록번호|주민등록번호|법인등록번호|사업장\s*주소|주소|연락처|이메일|계약\s*시작\s*희망일|계약\s*기간)\s*/,""); }
    }else if((m=/^([^:：]{1,20})[:：]\s*(.*)$/.exec(line)) && keyOfLabel(m[1])){
      key=keyOfLabel(m[1]); val=m[2];
    }else if(last==="addr" && !/^\[/.test(line)){ out.addr=(out.addr+" "+line).trim(); continue; }
    else continue;
    last=key;
    if(key && val!==null && !/^\(.*\)$/.test(val.trim())) out[key]=normVal(key,val);   // "(법인만)" 같은 안내문만 남은 칸은 빈칸 취급
  }
  return out;
}
function applyParsed(p){

  $("pasteInfo").textContent = got.length ? `반영: ${got.join(", ")}` + (miss.length?` / 비어 있음: ${miss.join(", ")}`:"") : "인식된 항목이 없어요. '고객용 양식 복사'로 보낸 양식 형태인지 확인해 주세요.";

function handleText(text){ if(String(text||"").trim()){ $("paste").value=text; applyParsed(parseKakao(text)); } }
function bindPaste(){
  $("paste").addEventListener("paste",()=>setTimeout(()=>handleText($("paste").value),0));
  $("btnApply").onclick=()=>handleText($("paste").value);
  $("btnTpl").onclick=async()=>{
    try{ await navigator.clipboard.writeText(FORM_TEMPLATE); $("pasteInfo").textContent="고객용 양식을 복사했어요. 카톡에 붙여넣어 보내세요."; }
    catch(e){ $("paste").value=FORM_TEMPLATE; $("paste").select(); $("pasteInfo").textContent="양식을 위 칸에 넣었어요. 선택된 상태에서 Ctrl+C 로 복사하세요."; }
  };
  // 화면 어디서든 붙여넣기 (입력칸에 커서가 있을 땐 그 칸에 그대로 붙여넣기)
  document.addEventListener("paste",e=>{
    const a=document.activeElement; if(a && /^(INPUT|TEXTAREA)$/.test(a.tagName)) return;
    const cd=e.clipboardData; if(!cd) return;
    const t=cd.getData("text/plain");
    if(t){ e.preventDefault(); handleText(t); }
    else if(Array.from(cd.items||[]).some(i=>i.type.startsWith("image/"))){ $("pasteInfo").textContent="이미지는 읽지 않아요. 카톡에서 글자를 복사(드래그 후 Ctrl+C)해서 붙여넣어 주세요."; }
  });
  // 끌어다 놓기: 선택한 글자 또는 .txt 파일(카톡 대화 내보내기)
  const stop=e=>{ e.preventDefault(); };
  ["dragenter","dragover"].forEach(ev=>document.addEventListener(ev,e=>{ stop(e); $("paste").classList.add("drag"); }));
  ["dragleave","drop"].forEach(ev=>document.addEventListener(ev,e=>{ if(ev==="drop"||e.target===document.documentElement) $("paste").classList.remove("drag"); }));
  document.addEventListener("drop",async e=>{
    stop(e); const dt=e.dataTransfer; if(!dt) return;
    const f=Array.from(dt.files||[]).find(f=>/\.txt$/i.test(f.name)||f.type==="text/plain");
    if(f){ handleText(await f.text()); return; }
    const t=dt.getData("text/plain"); if(t){ handleText(t); return; }
    if(dt.files && dt.files.length) $("pasteInfo").textContent="이미지·문서는 읽지 않아요. 카톡 글자를 복사해 붙여넣어 주세요.";
  });
}

    buttons.forEach(b=>{ const el=document.createElement("button"); el.textContent=b.label; if(b.sub) el.className="sub"; el.onclick=()=>{ idle(); res(b.value); }; $("ovBtns").appendChild(el); });
    $("ov").classList.add("on");
  });
}
function fitHeader(){ const h=document.querySelector("header"); if(h) document.documentElement.style.setProperty("--hh",h.offsetHeight+"px"); }
window.addEventListener("resize",fitHeader);
function syncMonthBtns(){ document.querySelectorAll(".mbtn").forEach(b=>b.classList.toggle("on", b.dataset.m===$("months").value)); }
function bind(){
  document.querySelectorAll(".mbtn").forEach(b=>b.onclick=()=>{ $("months").value=b.dataset.m; $("months").dispatchEvent(new Event("input",{bubbles:true})); });
  $("months").addEventListener("input",syncMonthBtns); syncMonthBtns();
  bindPaste();
  document.querySelectorAll("#form input").forEach(el=>{
    el.addEventListener("input", ()=>{
      if(["end","signDate","deposit","fname","start"].includes(el.id)) el.dataset.manual="1";
      if(el.id==="signDate" && !$("start").dataset.manual && el.value){ $("start").value=el.value; }   // 시작일은 직접 고치기 전까지 계약 작성일을 따라감
      if(["start","months"].includes(el.id)) $("end").dataset.manual="";
      if(el.id==="stdFee") $("deposit").dataset.manual="";
      if(["stdFee","discFee","deposit"].includes(el.id)){ const n=num(el.value); el.value=n?fmt(n):""; }
      if(el.type==="radio") $("fname").dataset.manual="";
      autoCalc(); if(el.id!=="fname") autoFname();
      schedule();
    });
  });
  // 도우미 서버(run.bat)로 열렸으면 바탕화면 저장 + PDF 자동 변환, 아니면 일반 다운로드
  const viaServer = location.protocol==="http:";
  const post=async(act,v)=>{ const r=await fetch("/api/register",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(Object.assign({},v,{action:act}))}); return r.json(); };
  const obPost=async(act,v)=>{ try{ const r=await fetch("/api/ob",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(Object.assign({},v,{action:act}))}); return await r.json(); }catch(e){ return {ok:false,error:String(e)}; } };
  const diffTable=d=>"<table><tr><th>항목</th><th>현재 값</th><th>새 값</th></tr>"+d.map(x=>"<tr><td>"+esc(x.label)+"</td><td>"+esc(x.old)+"</td><td>"+esc(x.new)+"</td></tr>").join("")+"</table>";
  // officeboard 비밀번호 입력 (이 PC의 officeboard_config.json 에만 저장)
  const askObPassword=async(first)=>{
    for(;;){
      const a=await modal("officeboard 비밀번호","<div>"+(first?"officeboard(온라인)에 자동 입력하려면 로그인 비밀번호가 한 번 필요해요.":"비밀번호가 맞지 않아요. 다시 입력해 주세요.")+"<br>이 PC에만 저장되고 다른 곳으로 보내지 않아요.</div><input type=\"password\" id=\"ovPw\" style=\"width:100%;margin-top:8px\" autocomplete=\"off\">",
        [{label:"저장",value:"save"},{label:"이번엔 건너뛰기",value:"skip",sub:true}]);
      if(a!=="save") return false;
      const pw=$("ovPw").value; busy("비밀번호 확인 중… (서버가 잠들어 있으면 1분쯤 걸릴 수 있어요)");
      let r; try{ r=await (await fetch("/api/ob-password",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:pw})})).json(); }catch(e){ r={ok:false}; }
      idle(); if(r.ok) return true; first=false;
    }
  };
  // 어떤 버튼을 누르든 먼저 고객list·officeboard 와 대조: 신규→등록 / 같은 내용→알림 / 달라짐→물어보고 변경
  const sync=async()=>{
    if(!viaServer) return {proceed:true,notes:[]};
    const v=vals();
    if(!v.rep){ await modal("대표자 성명이 필요해요","고객list에 등록하려면 대표자(성명)를 입력해 주세요.",[{label:"확인",value:1}]); return {proceed:false}; }
    v.num=window.regNum||""; v.obId=window.obId||"";
    v.rentTotal = v.type==="virtual" ? Math.round(v.disc*v.months*1.1) : 0;
    const useOb = v.type==="virtual";
    let c;
    busy("고객list 확인 중…");
    try{ c=await post("check",v); }catch(e){ c={ok:false,error:String(e)}; }
    idle();
    if(!c.ok){ await modal("고객list 오류",esc(c.error||"확인 실패"),[{label:"확인",value:1}]); return {proceed:false}; }
    let o=null;
    if(useOb){
      for(let tries=0;tries<3;tries++){
        busy("officeboard 확인 중… (서버가 잠들어 있으면 1분쯤 걸릴 수 있어요)"); o=await obPost("check",v); idle();
        if(o.ok) break;
        if(o.needPassword){ if(await askObPassword(!tries)) continue; o=null; break; }
        const a=await modal("officeboard에 연결하지 못했어요",esc(o.error||"")+"<br><br>officeboard에는 입력하지 않고 계속할까요?",[{label:"officeboard 없이 계속",value:"go"},{label:"취소",value:"no",sub:true}]);
        if(a!=="go") return {proceed:false}; o=null; break;
      }
      if(o && !o.ok) o=null;
    }
    const notes=[]; if(useOb && !o) notes.push("officeboard는 입력하지 않았어요");
    const sts=[c.status].concat(o?[o.status]:[]);
    if(sts.every(x=>x==="dup")){
      await modal("이미 등록된 고객이에요","고객list <b>"+esc(c.num)+"</b> ("+c.row+"행)"+(o?" 와 officeboard <b>"+esc(o.id)+"</b>":"")+" 에 같은 내용이 이미 있어요.<br>중복이라 등록하지 않았어요.",[{label:"확인",value:1}]);
      window.regNum=c.num; if(o) window.obId=o.id; return {proceed:false};
    }
    if(c.status!=="new") window.regNum=c.num; if(o && o.status!=="new") window.obId=o.id;
    // 달라진 내용은 한 번에 묻기
    let doUpdate=false;
    if(c.status==="changed" || (o && o.status==="changed")){
      let html="";
      if(c.status==="changed") html+="<b>고객list</b> "+esc(c.num)+" ("+c.row+"행)"+diffTable(c.diffs);
      if(o && o.status==="changed") html+="<b>officeboard</b> "+esc(o.id)+diffTable(o.diffs);
      const ans=await modal("변경된 내용이 있어요",html+"위 내용으로 변경할까요?",[{label:"예, 변경",value:"y"},{label:"아니요, 그대로 두기",value:"n",sub:true}]);
      doUpdate=(ans==="y"); if(!doUpdate) notes.push("달라진 내용은 변경하지 않았어요");
    }
    // 실행
    if(c.status==="new"){
      busy("고객list에 등록하는 중…"); let n; try{ n=await post("insert",v); }catch(e){ n={ok:false,error:String(e)}; } idle();
      if(!n.ok){ await modal("고객list 등록 실패",esc(n.error||""),[{label:"확인",value:1}]); return {proceed:false}; }
      window.regNum=n.num; if(n.room && n.room!==v.room){ setRoom(n.room); v.room=n.room; }
      notes.push("고객list 등록: "+n.num+" / "+(n.room||"-")+" ("+n.row+"행)");
    }else if(c.status==="changed" && doUpdate){
      busy("고객list를 변경하는 중…"); let u; try{ u=await post("update",v); }catch(e){ u={ok:false,error:String(e)}; } idle();
      if(!u.ok){ await modal("고객list 변경 실패",esc(u.error||""),[{label:"확인",value:1}]); return {proceed:false}; }
      if(u.room && u.room!==v.room){ setRoom(u.room); v.room=u.room; }
      notes.push("고객list 변경: "+u.num+" ("+u.changed.join(", ")+")");
    }
    if(o && (o.status==="new" || (o.status==="changed" && doUpdate))){
      busy("officeboard에 "+(o.status==="new"?"등록":"변경")+"하는 중…"); const r=await obPost(o.status==="new"?"insert":"update",v); idle();
      if(r.ok){ window.obId=r.id; notes.push("officeboard "+(o.status==="new"?"등록":"변경")+": "+r.id); }
      else notes.push("officeboard 실패: "+(r.error||""));
    }
    return {proceed:true,notes};
  };
  const send=async(kind)=>{
    // 1단계: 계약서 파일부터 만든다
    const blob=await buildDocx(vals(), true);   // 노란 음영 포함
    const name=fullFname();
    if(!viaServer){
      const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name+".docx"; a.click();
      setTimeout(()=>URL.revokeObjectURL(a.href),5000);
      msg("서버 없이 열려서 다운로드 폴더로 저장했어요. 바탕화면 저장·PDF 자동 변환·대시보드 저장은 run.bat 으로 열어주세요."); return;
    }
    let pickPath="", pickWarn="";
    try{
      const r0=await fetch("/api/pick?kind="+kind+"&name="+encodeURIComponent(name));
      const pj=await r0.json();
      if(!pj.ok) pickWarn="저장 위치 창을 열지 못해 바탕화면에 저장했어요 ("+(pj.error||"원인 불명").trim().split("\n").pop()+")";
      else if(!pj.path){ msg("저장을 취소했어요."); return; }
      else pickPath=pj.path;
    }catch(e){ pickWarn="저장 위치 창을 쓸 수 없어(서버가 옛 버전일 수 있어요) 바탕화면에 저장했어요"; }
    busy(kind==="pdf" ? "PDF로 변환하는 중이에요… 끝날 때까지 기다려 주세요 (5~10초)" : "Word 파일을 저장하는 중…");
    let fileMsg;
    try{
      const r=await fetch("/api/"+kind+"?name="+encodeURIComponent(name)+"&path="+encodeURIComponent(pickPath),{method:"POST",body:blob});
      const j=await r.json();
      if(!j.ok) throw new Error(j.error||"저장 실패");
      const base=f=>f.split("\\").pop();
      fileMsg="✔ 저장했어요: "+(j.pdf||j.docx)+(j.pdf?" (+ Word 파일)":"");
    }catch(e){ idle(); msg("저장 실패: "+e.message); return; }
    idle(); if(pickWarn) fileMsg=pickWarn+"\n"+fileMsg; msg(fileMsg);
    // 2단계: 공유오피스 대시보드(고객list 엑셀·officeboard)에 저장할지 묻는다
    const useOb=vals().type==="virtual";
    const ask=await modal("공유오피스 대시보드에 저장할까요?","방금 만든 계약서 내용을 <b>"+(useOb?"고객list 엑셀과 officeboard":"고객list 엑셀")+"</b>에 저장해요.<br>(이미 있는 고객이면 중복 안내 또는 변경 확인이 먼저 나와요.)",
      [{label:"예, 저장",value:"y"},{label:"아니요",value:"n",sub:true}]);
    if(ask!=="y"){ msg(fileMsg+"\n(대시보드에는 저장하지 않았어요)"); return; }
    const s=await sync();
    msg(fileMsg+(s.notes&&s.notes.length?"\n✔ "+s.notes.join("\n✔ "):(s.proceed?"":"\n(대시보드 저장은 하지 않았어요)")));
  };
  $("btnDocx").onclick=()=>send("docx");
  // ---- 호실 자동 배정 (비상주): 직접 입력하면 그 번호 우선, 이미 있으면 (2),(3) ----
  const room=$("room"), hint=$("roomHint"); let setting=false;
  const setRoom=v=>{ setting=true; room.value=v; room.dispatchEvent(new Event("input",{bubbles:true})); setting=false; };
  const jget=async u=>{ try{ const r=await fetch(u); return await r.json(); }catch(e){ return {ok:false,error:String(e)}; } };
  window.refreshRoom=async()=>{
    if(!viaServer) return;
    if(vals().type!=="virtual"){ if(!room.dataset.manual){ setRoom(""); } hint.textContent=""; return; }
    if(room.dataset.manual||window.regNum) return;
    const j=await jget("/api/room?corp="+($("isCorp").checked?1:0));
    if(room.dataset.manual) return;     // 응답을 기다리는 사이에 직접 입력했으면 덮어쓰지 않음
    if(j.ok){ setRoom(j.room); hint.className="hint"; hint.textContent="자동 배정 호실: "+j.room+" (직접 입력하면 그 번호가 우선)"; }
    else { hint.className="hint warn"; hint.textContent=j.error||"호실 자동 배정 실패"; }
  };
  room.addEventListener("input",()=>{ if(setting) return; if(room.value.trim()){ room.dataset.manual="1"; hint.textContent=""; } else { room.dataset.manual=""; refreshRoom(); } });
  room.addEventListener("change",async()=>{
    if(setting||!viaServer||!room.value.trim()) return;
    const j=await jget("/api/room-check?room="+encodeURIComponent(room.value.trim()));
    if(!j.ok){ hint.className="hint warn"; hint.textContent="고객list를 읽지 못해 호실 중복을 확인하지 못했어요. "+(j.error||""); return; }
    if(j.ok && j.room!==room.value.trim()){ const old=room.value.trim(); setRoom(j.room); hint.className="hint warn"; hint.textContent=old+" 은(는) 이미 사용 중이라 "+j.room+" 로 입력했어요."; }
  });
  document.querySelectorAll("input[name=type]").forEach(el=>el.addEventListener("change",refreshRoom));
  $("isCorp").addEventListener("change",refreshRoom);
  refreshRoom();
  // ---- 계약서 확대/축소 ----
  let zoom=100; const zApply=()=>{ $("doc").style.zoom=zoom/100; $("zVal").textContent=zoom+"%"; };
  $("zIn").onclick=()=>{ zoom=Math.min(200,zoom+10); zApply(); };
  $("zOut").onclick=()=>{ zoom=Math.max(40,zoom-10); zApply(); };
  $("zVal").onclick=()=>{ zoom=100; zApply(); };
  $("btnXls").onclick=async()=>{
    if(!viaServer){ msg("엑셀 열기는 run.bat 으로 열어야 해요."); return; }
    try{ const j=await (await fetch("/api/open-xlsx")).json(); msg(j.ok?"고객list 엑셀을 열었어요.":"엑셀 열기 실패: "+j.error); }catch(e){ msg("엑셀 열기 실패: "+e.message); }
  };
  // ---- 새 화면: 입력 내용을 모두 지우고 처음 상태로 ----
  $("btnNew").onclick=async()=>{
    const a=await modal("새 화면","입력한 내용을 모두 지우고 새로 시작할까요?<br>(이미 저장·등록한 내용은 그대로 남아요.)",[{label:"예, 새 화면",value:"y"},{label:"아니요",value:"n",sub:true}]);
    if(a!=="y") return;
    try{ sessionStorage.setItem("jw_customer_draft3", JSON.stringify({type:vals().type})); }catch(e){}   // 계약 종류만 유지
    location.reload();
  };
  // ---- 등록 취소: 같은 고객을 고객list·officeboard 에서 지움 (확인 후) ----
  $("btnCancel").onclick=async()=>{
    if(!viaServer){ msg("등록 취소는 run.bat 으로 열어야 해요."); return; }
    const v=vals(); v.num=window.regNum||""; v.obId=window.obId||"";
    busy("등록된 내용을 찾는 중…");
    const c=await post("check",v).catch(e=>({ok:false,error:String(e)}));
    let o=null; if(v.type==="virtual"){ o=await obPost("check",v); if(!o.ok){ if(o.needPassword){ idle(); if(await askObPassword(true)){ busy("등록된 내용을 찾는 중…"); o=await obPost("check",v); } else o=null; } else { o={status:"error",error:o.error}; } } }
    idle();
    if(!c.ok){ await modal("고객list 오류",esc(c.error||""),[{label:"확인",value:1}]); return; }
    const inX=c.status!=="new", inO=o && o.ok && o.status!=="new";
    if(o && o.status==="error"){ await modal("officeboard 확인 실패",esc(o.error||"")+"<br>officeboard 쪽 삭제는 할 수 없어요.",[{label:"확인",value:1}]); }
    if(!inX && !inO){ await modal("취소할 등록이 없어요","이 고객은 고객list에도 officeboard에도 등록돼 있지 않아요.",[{label:"확인",value:1}]); return; }
    let html="아래 등록을 지워요. <b>되돌릴 수 없어요.</b><ul style=\"margin:8px 0 8px 18px\">";
    if(inX) html+="<li>고객list <b>"+esc(c.num)+"</b> ("+c.row+"행) · "+esc(c.name||"")+" · 호실 "+esc(c.room||"-")+"</li>";
    if(inO) html+="<li>officeboard <b>"+esc(o.id)+"</b> · "+esc(o.name||"")+"</li>";
    html+="</ul>바탕화면에 저장된 Word·PDF 파일은 지워지지 않아요.";
    const ans=await modal("등록 취소",html,[{label:"예, 삭제",value:"y"},{label:"아니요",value:"n",sub:true}]);
    if(ans!=="y") return;
    const notes=[];
    if(inX){ busy("고객list에서 지우는 중…"); const r=await post("remove",v).catch(e=>({ok:false,error:String(e)})); idle(); notes.push(r.ok&&r.removed?"고객list에서 삭제: "+c.num:"고객list 삭제 실패: "+(r.error||"")); }
    if(inO){ busy("officeboard에서 지우는 중…"); const r=await obPost("remove",v); idle(); notes.push(r.ok&&r.removed?"officeboard에서 삭제: "+o.id:"officeboard 삭제 실패: "+(r.error||"")); }
    window.regNum=null; window.obId=null; room.dataset.manual=""; refreshRoom();
    msg("✔ "+notes.join("\n✔ "));
  };
  // ---- 고객list(엑셀) 등록: 위의 sync() 사용 ----
  $("btnPdf").onclick=()=>send("pdf");
}

window.addEventListener("DOMContentLoaded", ()=>{
  fitHeader();
  const had=load();
  bind();
  $("signDate").value=iso(new Date());   // 작성일은 항상 오늘이 기본 (수정 가능)
  if(!$("start").value) $("start").value=$("signDate").value;            // 시작일 기본값 = 계약 작성일
  else if(had && $("start").value!==$("signDate").value) $("start").dataset.manual="1";
  if(had) ["end","deposit","fname"].forEach(id=>{ if($(id).value) $(id).dataset.manual="1"; });
  autoCalc(); autoFname();
  render();
});
</script>
