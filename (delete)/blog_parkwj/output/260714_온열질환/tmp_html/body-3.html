<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans KR', sans-serif; }
  html, body { width: 1080px; height: 1080px; background: white; }

  .clipboard-frame { width: 907px; height: 903px; }
  .clip-wrapper { display: none; }

  .inner-card {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 20px;
  }

  .card-title {
    font-size: 44px;
    font-weight: 900;
    color: #1A2340;
    text-align: center;
    margin-bottom: 10px;
  }
  .card-title .accent { color: #F4803A; }

  .item-row {
    display: flex;
    align-items: center;
    gap: 24px;
    background: #FFF6EE;
    border-left: 8px solid #F4803A;
    border-radius: 18px;
    padding: 24px 30px;
  }

  .item-badge {
    width: 76px;
    height: 76px;
    border-radius: 50%;
    background: #F4803A;
    color: #fff;
    font-size: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .item-text .label {
    font-size: 30px;
    font-weight: 700;
    color: #1A2340;
  }
  .item-text .desc {
    font-size: 21px;
    color: #666;
    margin-top: 4px;
  }
</style>
</head>
<body>
<div class="clipboard-frame">
  <div class="clip-wrapper"></div>
  <div class="inner-card">
    <div class="card-title">온열질환 <span class="accent">고위험군</span></div>

    <div class="item-row">
      <div class="item-badge">👵</div>
      <div class="item-text"><div class="label">65세 이상 고령층</div><div class="desc">중증화 위험 99% 높음</div></div>
    </div>
    <div class="item-row">
      <div class="item-badge">💊</div>
      <div class="item-text"><div class="label">기저질환자</div><div class="desc">고혈압·당뇨·심장병·신경정신질환</div></div>
    </div>
    <div class="item-row">
      <div class="item-badge">👶</div>
      <div class="item-text"><div class="label">5세 이하 영유아</div><div class="desc">체온 조절 능력 미숙</div></div>
    </div>
    <div class="item-row">
      <div class="item-badge">☀️</div>
      <div class="item-text"><div class="label">임산부·실외 근로자</div><div class="desc">장시간 고온 노출</div></div>
    </div>
  </div>
</div>
</body>
</html>
