<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans KR', sans-serif; }
  html, body { width: 1080px; height: 1080px; background: white; }

  .clipboard-frame { width: 907px; height: 903px; }
  .clip-wrapper { display: none; }

  .inner-card {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 16px;
  }

  .card-title {
    font-size: 40px;
    font-weight: 900;
    color: #1A2340;
    text-align: center;
    margin-bottom: 8px;
  }
  .card-title .accent { color: #E24C4C; }

  .symptom-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  .symptom-card {
    background: #FDF1F1;
    border-radius: 18px;
    padding: 20px 16px;
    text-align: center;
  }
  .symptom-icon { font-size: 48px; }
  .symptom-label {
    font-size: 25px;
    font-weight: 700;
    color: #1A2340;
    margin-top: 8px;
  }

  .symptom-wide {
    grid-column: 1 / span 2;
  }
</style>
</head>
<body>
<div class="clipboard-frame">
  <div class="clip-wrapper"></div>
  <div class="inner-card">
    <div class="card-title">식중독 <span class="accent">초기 증상</span></div>

    <div class="symptom-grid">
      <div class="symptom-card"><div class="symptom-icon">🤢</div><div class="symptom-label">오심</div></div>
      <div class="symptom-card"><div class="symptom-icon">🤮</div><div class="symptom-label">구토</div></div>
      <div class="symptom-card"><div class="symptom-icon">😖</div><div class="symptom-label">복통</div></div>
      <div class="symptom-card"><div class="symptom-icon">🚻</div><div class="symptom-label">설사</div></div>
      <div class="symptom-card symptom-wide"><div class="symptom-icon">🌡️</div><div class="symptom-label">발열</div></div>
    </div>
  </div>
</div>
</body>
</html>
