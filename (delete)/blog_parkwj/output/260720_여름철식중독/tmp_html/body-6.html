<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans KR', sans-serif; }
  html, body { width: 1080px; height: 1080px; background: white; }

  .clipboard-frame { width: 907px; height: 903px; }
  .clip-wrapper { display: none; }

  .inner-card {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 20px;
  }

  .card-title {
    font-size: 40px;
    font-weight: 900;
    color: #1A2340;
    text-align: center;
    margin-bottom: 6px;
  }
  .card-title .accent { color: #2F8FED; }

  .step {
    display: flex;
    align-items: flex-start;
    gap: 20px;
    background: #F0F7FF;
    border-radius: 16px;
    padding: 20px 26px;
  }
  .step .num {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: #2F8FED;
    color: #fff;
    font-weight: 900;
    font-size: 24px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .step .txt {
    font-size: 25px;
    font-weight: 700;
    color: #1A2340;
    line-height: 1.4;
  }
  .step .sub {
    font-size: 18px;
    font-weight: 400;
    color: #777;
    margin-top: 4px;
  }

  .warn-badge {
    text-align: center;
    font-size: 21px;
    font-weight: 700;
    color: #C93838;
    background: #FDE0E0;
    border-radius: 14px;
    padding: 16px;
    margin-top: 2px;
  }
</style>
</head>
<body>
<div class="clipboard-frame">
  <div class="clip-wrapper"></div>
  <div class="inner-card">
    <div class="card-title">식중독 <span class="accent">수분 보충 방법</span></div>

    <div class="step">
      <div class="num">1</div>
      <div><div class="txt">경구수분보충용액 만들기</div><div class="sub">끓인 물 1L + 설탕 4작은술 + 소금 1작은술</div></div>
    </div>
    <div class="step">
      <div class="num">2</div>
      <div><div class="txt">시판 이온음료 섭취</div><div class="sub">경구수분보충용액 대체 가능</div></div>
    </div>
    <div class="step">
      <div class="num">3</div>
      <div><div class="txt">소화 쉬운 음식부터 시작</div><div class="sub">미음·기름기 없는 쌀죽</div></div>
    </div>

    <div class="warn-badge">지사제 임의 복용 금지 — 회복 지연될 수 있음</div>
  </div>
</div>
</body>
</html>
