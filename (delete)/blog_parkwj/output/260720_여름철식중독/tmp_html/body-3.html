<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans KR', sans-serif; }
  html, body { width: 1080px; height: 1080px; background: white; }

  .clipboard-frame { width: 907px; height: 903px; }
  .clip-wrapper { display: none; }

  .inner-card {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 16px;
  }

  .card-title {
    font-size: 40px;
    font-weight: 900;
    color: #1A2340;
    text-align: center;
    margin-bottom: 8px;
  }
  .card-title .accent { color: #2F8FED; }

  .item-row {
    display: flex;
    align-items: center;
    gap: 20px;
    background: #F0F7FF;
    border-radius: 16px;
    padding: 18px 26px;
  }

  .item-badge {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: #2F8FED;
    color: #fff;
    font-size: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .item-text .label {
    font-size: 26px;
    font-weight: 700;
    color: #1A2340;
  }
  .item-text .desc {
    font-size: 19px;
    color: #666;
    margin-top: 2px;
  }
</style>
</head>
<body>
<div class="clipboard-frame">
  <div class="clip-wrapper"></div>
  <div class="inner-card">
    <div class="card-title">장염비브리오균, <span class="accent">이렇게 위험해요</span></div>

    <div class="item-row">
      <div class="item-badge">🌊</div>
      <div class="item-text"><div class="label">서식 환경</div><div class="desc">연안 바닷물·갯벌·어패류</div></div>
    </div>
    <div class="item-row">
      <div class="item-badge">🌡️</div>
      <div class="item-text"><div class="label">증식 시작 온도</div><div class="desc">바닷물 15℃ 이상부터 증식</div></div>
    </div>
    <div class="item-row">
      <div class="item-badge">⚡</div>
      <div class="item-text"><div class="label">폭발적인 증식 속도</div><div class="desc">20~37℃에서 3~4시간 만에 100만 배</div></div>
    </div>
    <div class="item-row">
      <div class="item-badge">📅</div>
      <div class="item-text"><div class="label">발생 집중 시기</div><div class="desc">연간 발생의 86%가 7~9월</div></div>
    </div>
  </div>
</div>
</body>
</html>
