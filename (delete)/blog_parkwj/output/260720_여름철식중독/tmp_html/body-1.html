<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans KR', sans-serif; }
  html, body { width: 1080px; height: 1080px; background: white; }

  .clipboard-frame { width: 907px; height: 903px; }
  .clip-wrapper { display: none; }

  .inner-card {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 24px;
  }

  .card-title {
    font-size: 40px;
    font-weight: 900;
    color: #1A2340;
    text-align: center;
    margin-bottom: 4px;
  }
  .card-title .accent { color: #F4803A; }

  .hero-stat {
    text-align: center;
    background: linear-gradient(160deg, #F4803A, #E8963F);
    border-radius: 24px;
    padding: 34px 20px 28px;
  }
  .hero-num {
    font-size: 96px;
    font-weight: 900;
    color: #fff;
    line-height: 1;
  }
  .hero-label {
    font-size: 26px;
    font-weight: 700;
    color: #FFF0E0;
    margin-top: 10px;
  }

  .chip-row {
    display: flex;
    gap: 20px;
  }
  .chip {
    flex: 1;
    background: #FFF6EE;
    border-radius: 18px;
    padding: 22px 18px;
    text-align: center;
  }
  .chip-num {
    font-size: 42px;
    font-weight: 900;
    color: #E24C4C;
  }
  .chip-desc {
    font-size: 21px;
    font-weight: 700;
    color: #1A2340;
    margin-top: 6px;
    line-height: 1.4;
  }
</style>
</head>
<body>
<div class="clipboard-frame">
  <div class="clip-wrapper"></div>
  <div class="inner-card">
    <div class="card-title">여름철 식중독, <span class="accent">왜 늘어날까?</span></div>

    <div class="hero-stat">
      <div class="hero-num">52%</div>
      <div class="hero-label">전체 식중독 환자 중 6~9월 발생 비율</div>
    </div>

    <div class="chip-row">
      <div class="chip">
        <div class="chip-num">26%↑</div>
        <div class="chip-desc">전년 동기 대비<br>환자 증가</div>
      </div>
      <div class="chip">
        <div class="chip-num">7%↑</div>
        <div class="chip-desc">기온 1℃ 상승 시<br>환자 증가율</div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
