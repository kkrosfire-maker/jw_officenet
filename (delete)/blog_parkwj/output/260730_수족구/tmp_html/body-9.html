<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans KR', sans-serif; }
  html, body { width: 1080px; height: 1080px; background: white; }
  .clipboard-frame { width: 907px; height: 903px; }
  .clip-wrapper { display: none; }
  .inner-card { width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; gap: 28px; }
  .card-title { font-size: 44px; font-weight: 900; color: #1A2340; text-align: center; }
  .card-title .accent { color: #F4803A; }
  .row { display: flex; align-items: center; gap: 24px; background: #FFF6EE; border-left: 8px solid #F4803A; border-radius: 18px; padding: 30px; }
  .row-icon { width: 74px; height: 74px; border-radius: 50%; background: #F4803A; color: #fff; font-size: 32px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .row-text .label { font-size: 27px; font-weight: 700; color: #1A2340; }
  .row-text .desc { font-size: 21px; color: #666; margin-top: 5px; }
  .warn { text-align: center; font-size: 25px; font-weight: 700; color: #C93838; background: #FDE0E0; border-radius: 16px; padding: 28px; line-height: 1.5; }
</style>
</head>
<body>
<div class="clipboard-frame">
  <div class="clip-wrapper"></div>
  <div class="inner-card">
    <div class="card-title">수족구병 <span class="accent">예방백신</span></div>
    <div class="row"><div class="row-icon">🚫</div><div class="row-text"><div class="label">국내·미국</div><div class="desc">허가된 예방백신·특이 치료제 없음</div></div></div>
    <div class="row"><div class="row-icon">💉</div><div class="row-text"><div class="label">중국</div><div class="desc">EV-A71 백신, 생후 6~71개월 대상</div></div></div>
    <div class="warn">EV-A71형만 대상<br>CV-A16·CV-A6 등 다른 원인은 포괄 못 함</div>
  </div>
</div>
</body>
</html>
