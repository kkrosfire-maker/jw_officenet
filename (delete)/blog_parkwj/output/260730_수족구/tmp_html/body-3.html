<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans KR', sans-serif; }
  html, body { width: 1080px; height: 1080px; background: white; }
  .clipboard-frame { width: 907px; height: 903px; }
  .clip-wrapper { display: none; }
  .inner-card { width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; gap: 26px; }
  .card-title { font-size: 44px; font-weight: 900; color: #1A2340; text-align: center; }
  .card-title .accent { color: #F4803A; }
  .row { display: flex; align-items: center; gap: 24px; background: #FFF6EE; border-left: 8px solid #F4803A; border-radius: 18px; padding: 26px 30px; }
  .row-icon { width: 74px; height: 74px; border-radius: 50%; background: #F4803A; color: #fff; font-size: 34px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .row-text { font-size: 27px; font-weight: 700; color: #1A2340; }
  .hl { text-align: center; font-size: 25px; font-weight: 700; color: #1A2340; background: #FFF0DC; border-radius: 16px; padding: 26px; line-height: 1.5; }
</style>
</head>
<body>
<div class="clipboard-frame">
  <div class="clip-wrapper"></div>
  <div class="inner-card">
    <div class="card-title">수족구병 <span class="accent">전파 경로</span></div>
    <div class="row"><div class="row-icon">💧</div><div class="row-text">대변·침·콧물 등 분비물에 직접 접촉</div></div>
    <div class="row"><div class="row-icon">🖐️</div><div class="row-text">오염된 손으로 눈·코·입을 만짐</div></div>
    <div class="row"><div class="row-icon">🧸</div><div class="row-text">장난감·문 손잡이 공동 접촉면</div></div>
    <div class="hl">잠복기 대개 3~7일<br>발병 후 첫 1주에 전염력이 가장 강함</div>
  </div>
</div>
</body>
</html>
