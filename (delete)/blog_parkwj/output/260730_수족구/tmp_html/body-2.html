<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans KR', sans-serif; }
  html, body { width: 1080px; height: 1080px; background: white; }
  .clipboard-frame { width: 907px; height: 903px; }
  .clip-wrapper { display: none; }
  .inner-card { width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; gap: 32px; }
  .card-title { font-size: 44px; font-weight: 900; color: #1A2340; text-align: center; }
  .card-title .accent { color: #F4803A; }
  .compare-wrap { display: flex; gap: 22px; }
  .compare-col { flex: 1; border-radius: 20px; padding: 40px 30px; color: #fff; }
  .compare-col.a { background: linear-gradient(160deg, #F4803A, #E8963F); }
  .compare-col.b { background: linear-gradient(160deg, #3C4A6B, #2A3550); }
  .col-title { font-size: 30px; font-weight: 900; text-align: center; margin-bottom: 24px; padding-bottom: 18px; border-bottom: 3px solid rgba(255,255,255,0.5); }
  .col-item { font-size: 24px; line-height: 1.55; margin-bottom: 18px; padding-left: 22px; position: relative; }
  .col-item:last-child { margin-bottom: 0; }
  .col-item::before { content: "•"; position: absolute; left: 0; }
  .warn { text-align: center; font-size: 24px; font-weight: 700; color: #C93838; background: #FDE0E0; border-radius: 16px; padding: 24px; }
</style>
</head>
<body>
<div class="clipboard-frame">
  <div class="clip-wrapper"></div>
  <div class="inner-card">
    <div class="card-title">수족구병 <span class="accent">원인 바이러스</span></div>
    <div class="compare-wrap">
      <div class="compare-col a">
        <div class="col-title">교과서·학회 기준</div>
        <div class="col-item">콕사키바이러스 A16형</div>
        <div class="col-item">엔테로바이러스 71형(EV71)</div>
      </div>
      <div class="compare-col b">
        <div class="col-title">최근 감시 기준</div>
        <div class="col-item">콕사키바이러스 A6형(CV-A6)</div>
        <div class="col-item">광주 2022: 검출 82.3%,<br>그중 CV-A6가 95.6%</div>
      </div>
    </div>
    <div class="warn">EV71은 중증 수족구병 위험이 높음 (OR 4.44)</div>
  </div>
</div>
</body>
</html>
