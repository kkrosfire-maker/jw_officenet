<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans KR', sans-serif; }
  html, body { width: 1080px; height: 1080px; background: white; }

  .clipboard-frame { width: 907px; height: 903px; }
  .clip-wrapper { display: none; }

  .inner-card {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 20px;
  }

  .card-title {
    font-size: 40px;
    font-weight: 900;
    color: #1A2340;
    text-align: center;
    margin-bottom: 6px;
  }
  .card-title .accent { color: #2F6FED; }

  .item-row {
    display: flex;
    align-items: center;
    gap: 24px;
    background: #EAF2FE;
    border-left: 8px solid #2F6FED;
    border-radius: 18px;
    padding: 24px 30px;
  }

  .item-badge {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: #2F6FED;
    color: #fff;
    font-size: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .item-text .label {
    font-size: 28px;
    font-weight: 700;
    color: #1A2340;
  }
</style>
</head>
<body>
<div class="clipboard-frame">
  <div class="clip-wrapper"></div>
  <div class="inner-card">
    <div class="card-title">시술 전 <span class="accent">확인사항</span></div>

    <div class="item-row">
      <div class="item-badge">✓</div>
      <div class="item-text"><div class="label">현재 질환 · 복용약물 고지</div></div>
    </div>
    <div class="item-row">
      <div class="item-badge">✓</div>
      <div class="item-text"><div class="label">알레르기 병력 · 임신 여부</div></div>
    </div>
    <div class="item-row">
      <div class="item-badge">✓</div>
      <div class="item-text"><div class="label">정확한 성분 확인</div></div>
    </div>
    <div class="item-row">
      <div class="item-badge">✓</div>
      <div class="item-text"><div class="label">무균 시술 환경 확인</div></div>
    </div>
  </div>
</div>
</body>
</html>
