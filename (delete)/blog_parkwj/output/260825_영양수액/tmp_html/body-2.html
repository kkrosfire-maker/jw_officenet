<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans KR', sans-serif; }
  html, body { width: 1080px; height: 1080px; background: white; }

  .clipboard-frame { width: 907px; height: 903px; }
  .clip-wrapper { display: none; }

  .inner-card {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 36px;
  }

  .card-title {
    font-size: 46px;
    font-weight: 900;
    color: #1A2340;
    text-align: center;
    margin-bottom: 6px;
  }

  .compare-wrap {
    display: flex;
    gap: 24px;
  }

  .compare-col {
    flex: 1;
    border-radius: 20px;
    padding: 44px 30px;
  }

  .col-title {
    font-size: 36px;
    font-weight: 900;
    text-align: center;
    margin-bottom: 28px;
    padding-bottom: 20px;
    border-bottom: 3px solid rgba(255,255,255,0.6);
    color: #fff;
  }

  .col-item {
    font-size: 27px;
    color: #fff;
    line-height: 1.6;
    margin-bottom: 28px;
    padding-left: 22px;
    position: relative;
  }
  .col-item:last-child { margin-bottom: 0; }
  .col-item::before {
    content: "•";
    position: absolute;
    left: 0;
  }

  .yes { background: linear-gradient(160deg, #3D9970, #2E7D5B); }
  .no { background: linear-gradient(160deg, #8B93A6, #6B7280); }

  .warn-badge {
    text-align: center;
    font-size: 26px;
    font-weight: 700;
    color: #C93838;
    background: #FDE0E0;
    border-radius: 16px;
    padding: 26px;
    margin-top: 4px;
  }
</style>
</head>
<body>
<div class="clipboard-frame">
  <div class="clip-wrapper"></div>
  <div class="inner-card">
    <div class="card-title">영양수액, 효과 <span style="color:#F4803A">근거는?</span></div>

    <div class="compare-wrap">
      <div class="compare-col yes">
        <div class="col-title">근거 있음</div>
        <div class="col-item">흡수장애 환자 영양 교정</div>
        <div class="col-item">수술 후 회복기 지원</div>
        <div class="col-item">만성질환자 영양 공급</div>
      </div>
      <div class="compare-col no">
        <div class="col-title">근거 부족</div>
        <div class="col-item">단순 피로해소 목적</div>
        <div class="col-item">컨디션 관리(웰니스)</div>
        <div class="col-item">건강한 사람 효과 검증</div>
      </div>
    </div>

    <div class="warn-badge">건강한 사람 대상 효과 입증 연구는 매우 적음</div>
  </div>
</div>
</body>
</html>
