<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CSO 업계 소식 | 정원유니어스</title>
<link rel="icon" href="assets/00_favicon_64.png">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css" rel="stylesheet">
<link rel="stylesheet" href="assets/board.css">
</head>
<body>
<header><div class="in">
  <a href="#" data-home="" class="logo"><img src="assets/logo_jw.png" alt="정원유니어스 로고"><span>정원유니어스<small>JUNGWON UNIUS</small></span></a>
  <nav class="tnav"><a href="#" data-home="">HOME</a><a href="#" data-home="#services">SERVICE</a><a href="news.html" class="on keep">NEWS</a><a href="#" data-home="#contact" class="keep">CONTACT</a></nav>
</div></header>

<section class="phead">
  <div class="ghost">NEWS</div>
  <div class="wrap">
    <div class="eyebrow">CSO news</div>
    <h1>CSO 업계 소식</h1>
    <p>제약 CSO 시장의 최신 동향과 정원유니어스의 소식을 전해드립니다.</p>
    <div class="cnt">전체 게시글 <b id="total">0</b>개</div>
  </div>
</section>

<section class="board" id="list"><div class="wrap">
  <div class="grid" id="grid"></div>
  <div class="pager" id="pager"></div>
</div></section>

<footer><div class="wrap">
  <div class="row">
    <div><a href="#" data-home="" class="logo"><img src="assets/logo_jw.png" alt="" style="width:36px;height:36px;border-radius:9px"><span>정원유니어스(주)<small>JUNGWON UNIUS</small></span></a>
    <p>경기 김포시 풍무로146번길 26 프라미스빌딩 4층 A01호<br>010-6498-0999 · jungwonunius@naver.com</p></div>
    <div><p><a href="https://jwunius.imweb.me/?mode=policy">이용약관</a> &nbsp;|&nbsp; <a href="https://jwunius.imweb.me/?mode=privacy">개인정보처리방침</a></p></div>
  </div>
  <div class="copy">© 2026 JUNGWON UNIUS. ALL RIGHTS RESERVED.</div>
</div></footer>

<script src="news/config.js"></script>
<script src="news/posts.js"></script>
<script>
document.querySelectorAll('[data-home]').forEach(a=>a.href=(window.HOME_URL||'index.html')+(a.dataset.home||''));
const PER=12;
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const posts=(window.POSTS||[]).slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')||b.id-a.id);
const pages=Math.max(1,Math.ceil(posts.length/PER));
let page=Math.min(Math.max(parseInt(new URLSearchParams(location.search).get('page'))||1,1),pages);
document.getElementById('total').textContent=posts.length;
const grid=document.getElementById('grid'),pager=document.getElementById('pager');
function card(p){return `<a class="bc" href="news_view.html?id=${p.id}"><div class="th"><img loading="lazy" src="${esc(p.thumb)}" alt=""></div><div class="tx"><time>${esc((p.date||'').replace(/-/g,'.'))}</time><h3>${esc(p.title)}</h3><p>${esc(p.summary)}</p><span class="go">자세히 보기 <i>›</i></span></div></a>`}
function nums(){ // 많을 때는 현재 페이지 주변만 표시
  if(pages<=7)return [...Array(pages)].map((_,i)=>i+1);
  const s=new Set([1,pages,page-1,page,page+1]);const a=[...s].filter(n=>n>=1&&n<=pages).sort((x,y)=>x-y);
  const r=[];a.forEach((n,i)=>{if(i&&n-a[i-1]>1)r.push('…');r.push(n)});return r}
function render(){
  const items=posts.slice((page-1)*PER,page*PER);
  grid.innerHTML=items.length?items.map(card).join(''):'<div class="empty">등록된 게시글이 없습니다.</div>';
  pager.innerHTML=pages<=1?'':`<button ${page<=1?'disabled':''} data-p="${page-1}" aria-label="이전">‹</button>`+
    nums().map(n=>n==='…'?'<span>…</span>':`<button class="${n===page?'on':''}" data-p="${n}">${n}</button>`).join('')+
    `<button ${page>=pages?'disabled':''} data-p="${page+1}" aria-label="다음">›</button>`;
}
pager.onclick=e=>{const b=e.target.closest('button[data-p]');if(!b||b.disabled)return;page=+b.dataset.p;render();
  try{history.pushState({},'','?page='+page)}catch(_){}
  document.getElementById('list').scrollIntoView({behavior:'smooth'})};
addEventListener('popstate',()=>{page=Math.min(Math.max(parseInt(new URLSearchParams(location.search).get('page'))||1,1),pages);render()});
render();
</script>
</body>
</html>
