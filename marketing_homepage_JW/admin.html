<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>게시판 관리자 | 정원유니어스</title>
<link rel="icon" href="assets/00_favicon_64.png">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css" rel="stylesheet">
<style>
:root{--g:#003C24;--g2:#0a5a38;--g3:#1f8a5b;--lime:#c8f169;--ink:#0d1a14;--mute:#5d6b64;--bg:#f6f8f5;--line:#e3e9e4}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
button{font:inherit;cursor:pointer}
.top{background:var(--g);color:#fff;padding:26px 40px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.top h1{font-size:22px;letter-spacing:-.03em}.top small{color:var(--lime);letter-spacing:.2em;font-weight:700;font-size:11px;display:block}
.top a{color:#fff;font-size:14px;border:1px solid rgba(255,255,255,.4);padding:9px 18px;border-radius:99px;text-decoration:none}
.top a:hover{background:#fff;color:var(--g)}
.top .who{color:#cfe8d9;font-size:13px;margin-right:14px}
.wrap{max-width:1180px;margin:34px auto;padding:0 28px;display:grid;grid-template-columns:420px 1fr;gap:28px;align-items:start}
.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:28px}
.card h2{font-size:18px;letter-spacing:-.03em;margin-bottom:18px}
label{display:block;font-size:13px;font-weight:700;margin:14px 0 6px;color:#27332c}
input[type=text],input[type=date],input[type=password],textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;font:inherit;font-size:15px;background:#fff;transition:.2s}
input:focus,textarea:focus{outline:0;border-color:var(--g)}
textarea{resize:vertical;min-height:90px}
.hint{font-size:12px;color:var(--mute);margin-top:4px}
.drop{border:2px dashed var(--line);border-radius:14px;padding:16px;text-align:center;color:var(--mute);font-size:14px;cursor:pointer;transition:.2s;position:relative;overflow:hidden}
.drop:hover{border-color:var(--g);color:var(--g)}
.drop img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;display:none;margin-bottom:10px}
.drop.has img{display:block}
.row{display:flex;gap:10px;margin-top:22px}
.btn{flex:1;border:0;border-radius:99px;padding:14px;font-weight:800;font-size:15px;background:var(--g);color:#fff;transition:.25s}
.btn:hover{background:var(--g2)}.btn.sub{background:#fff;color:var(--g);border:1.5px solid var(--g);flex:.6}
.btn:disabled{opacity:.5;cursor:default}
.chk{display:flex;align-items:center;gap:8px;margin-top:16px;font-size:14px;font-weight:700}.chk input{width:18px;height:18px}
.list .it{display:grid;grid-template-columns:96px 1fr auto;gap:16px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.list .it:first-of-type{border-top:0}
.list img{width:96px;height:72px;object-fit:cover;border-radius:10px;background:var(--bg)}
.list .it{border-radius:12px;transition:background .15s}
.list .it.over{background:#eef7f1;outline:2px dashed var(--g3);outline-offset:-2px}
.drop.over{border-color:var(--g);background:#eef7f1;color:var(--g)}
.list b{display:block;font-size:15.5px;letter-spacing:-.02em;line-height:1.4}.list small{color:var(--mute)}
.tmp{display:inline-block;margin-left:8px;background:#fff3cd;color:#8a6100;border:1px solid #ffe08a;border-radius:99px;padding:1px 10px;font-size:11.5px;font-weight:700}
.bdg{display:inline-block;margin-left:8px;border-radius:99px;padding:1px 10px;font-size:11.5px;font-weight:700;border:1px solid}
.bdg.rv{background:#e8f1ff;color:#1a56b0;border-color:#b9d3ff}.bdg.au{background:#f1ebff;color:#5b34b0;border-color:#d4c4ff}
.tabs{display:flex;gap:8px;margin:-4px 0 14px}
.tabs button{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:6px 16px;font-size:13px;font-weight:700}
.tabs button.on{background:var(--g);color:#fff;border-color:var(--g)}
.acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.acts button{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:7px 16px;font-size:13px;font-weight:700}
.acts button:hover{border-color:var(--g);color:var(--g)}.acts .del:hover{border-color:#c0392b;color:#c0392b}
.acts .pub{border-color:var(--g);color:var(--g)}.acts .pub.off{border-color:#b9770e;color:#b9770e}
.login{max-width:420px;margin:90px auto;padding:0 20px}.login .card{padding:34px}
.toast{position:fixed;left:50%;bottom:34px;transform:translate(-50%,30px);background:#111;color:#fff;padding:13px 24px;border-radius:99px;font-weight:700;opacity:0;transition:.35s;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}.toast.err{background:#b3261e}
@media(max-width:900px){.wrap{grid-template-columns:1fr}.top{padding:20px}.list .it{grid-template-columns:72px 1fr}.list .it img{width:72px;height:54px}.list .acts{grid-column:1/-1;justify-content:flex-start}}
</style>
</head>
<body>
<div class="top"><div><small>ADMIN</small><h1>CSO 업계 소식 · 게시판 관리</h1></div>
  <div><span class="who" id="who"></span><a href="news.html">게시판 보기 ↗</a> <a href="#" id="out" style="display:none;margin-left:6px">로그아웃</a></div></div>

<div class="login" id="login" style="display:none"><form class="card" id="lf">
  <h2>관리자 로그인</h2>
  <label>이메일</label><input type="text" id="em" autocomplete="username" required>
  <label>비밀번호</label><input type="password" id="pw" autocomplete="current-password" required>
  <div class="row"><button class="btn" id="lb" type="submit">로그인</button></div>
  <p class="hint" id="lmsg" style="margin-top:12px;color:#b3261e"></p>
</form></div>

<div class="wrap" id="app" style="display:none">
  <form class="card" id="f">
    <h2 id="ft">새 글 등록</h2>
    <label>제목 *</label><input type="text" id="title" maxlength="200" required>
    <label>날짜 *</label><input type="date" id="date" required>
    <label>썸네일 이미지</label>
    <div class="drop" id="drop"><img id="prev" alt=""><span id="dropTx">클릭하거나 이미지를 끌어다 놓기 (jpg·png·webp)</span><input type="file" id="file" accept="image/jpeg,image/png,image/webp" hidden></div>
    <div class="hint">가로 1000px로 자동 축소되어 저장됩니다. 4:3 권장. 없으면 기본 이미지가 쓰입니다.</div>
    <label>요약 (목록 카드에 표시, 500자 이내)</label><textarea id="summary" maxlength="500"></textarea>
    <label>본문 (상세 페이지에 표시)</label><textarea id="body" style="min-height:150px"></textarea>
    <label>출처 (매체명, 선택)</label><input type="text" id="source" placeholder="예: 약사공론">
    <label>원문 링크 (선택)</label><input type="text" id="link" placeholder="https://...">
    <label class="chk"><input type="checkbox" id="pub" checked> 바로 공개</label>
    <div class="row"><button class="btn" id="save" type="submit">등록하기</button><button class="btn sub" id="cancel" type="button" style="display:none">수정 취소</button></div>
  </form>

  <div class="card list"><h2>글 목록 <span id="cnt" style="color:var(--g3)"></span></h2>
    <div class="tabs"><button class="on" data-f="all">전체</button><button data-f="draft">검토 대기</button></div>
    <div id="items"></div></div>
</div>
<input type="file" id="tfile" accept="image/jpeg,image/png,image/webp" hidden>
<div class="toast" id="toast"></div>

<script src="news/config.js"></script>
<script src="news/auth.js"></script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DEF='assets/news_thumbnail_default.webp';
let posts=[],editId=null,thumbBlob=null,filter='all',thumbTarget=null;
// Storage 에 올린 이미지가 아니면(기존 assets/ 임시 이미지) '임시 이미지' 배지 표시
const isTemp=p=>!!p.thumb&&p.thumb.indexOf('/storage/v1/object/public/news-thumbs/')<0&&p.thumb!==DEF;
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
function toast(m,err){const t=$('toast');t.textContent=m;t.className='toast on'+(err?' err':'');clearTimeout(toast._t);toast._t=setTimeout(()=>t.className='toast',2800)}
const fields=()=>({title:$('title').value.trim(),date:$('date').value,summary:$('summary').value.trim(),body:$('body').value.trim(),source:$('source').value.trim(),link:$('link').value.trim(),published:$('pub').checked});
function check(d){
  if(!d.title||d.title.length>200)return'제목은 1~200자로 입력해 주세요.';
  if(!/^\d{4}-\d{2}-\d{2}$/.test(d.date))return'날짜를 입력해 주세요.';
  if(d.summary.length>500)return'요약은 500자 이내로 입력해 주세요.';
  if(d.body.length>20000)return'본문이 너무 깁니다.';
  if(d.link&&!/^https?:\/\//i.test(d.link))return'원문 링크는 http:// 또는 https:// 로 시작해야 합니다.';
  return''}
function toBlob(file){return new Promise((ok,no)=>{const rd=new FileReader();rd.onerror=no;rd.onload=()=>{const im=new Image();im.onerror=no;im.onload=()=>{
  const W=Math.min(1000,im.width),H=Math.round(im.height*W/im.width),c=document.createElement('canvas');c.width=W;c.height=H;c.getContext('2d').drawImage(im,0,0,W,H);
  c.toBlob(b=>b?ok(b):no(),'image/jpeg',.86)};im.src=rd.result};rd.readAsDataURL(file)})}
const uploadThumb=blob=>NewsAuth.upload(Date.now()+'_'+Math.random().toString(36).slice(2,8)+'.jpg',blob);

// ---- 로그인 / 화면 전환
async function enter(){
  if(!NewsAuth.hasSession()){show(false);return}
  if(!(await NewsAuth.isAdmin())){NewsAuth.signOut();show(false,'관리자 권한이 없는 계정이거나 로그인이 만료되었습니다.');return}
  show(true);reset();await load()}
function show(ok,msg){
  $('login').style.display=ok?'none':'';$('app').style.display=ok?'':'none';$('out').style.display=ok?'':'none';
  $('who').textContent=ok?NewsAuth.email():'';if(msg)$('lmsg').textContent=msg}
$('lf').onsubmit=async e=>{e.preventDefault();$('lb').disabled=true;$('lmsg').textContent='';
  try{await NewsAuth.signIn($('em').value.trim(),$('pw').value);$('pw').value='';await enter()}
  catch(err){$('lmsg').textContent=err.message}finally{$('lb').disabled=false}};
$('out').onclick=e=>{e.preventDefault();NewsAuth.signOut();show(false)};

// ---- 목록
async function load(){
  try{posts=await NewsAuth.rest('GET','posts?select=*&order=date.desc,id.desc')||[]}catch(err){toast(err.message,1);posts=[]}
  const drafts=posts.filter(p=>!p.published).length,tc=posts.filter(isTemp).length;
  $('cnt').innerHTML='('+posts.length+')'+(drafts?' <span class="bdg rv" style="margin-left:6px">검토 대기 '+drafts+'</span>':'')+(tc?' <span class="tmp" style="margin-left:6px">임시 이미지 '+tc+'개</span>':'');
  draw()}
function draw(){
  const list=posts.filter(p=>filter==='all'||!p.published);
  $('items').innerHTML=list.length?list.map(p=>`<div class="it" data-id="${p.id}"><img src="${esc(p.thumb||DEF)}" alt=""><div><b>${esc(p.title)}</b><small>${esc(p.date)}${p.source?' · '+esc(p.source):''}${p.score!=null?' · 관련도 '+p.score:''}</small>${p.published?'':'<span class="bdg rv">검토 대기</span>'}${p.auto?'<span class="bdg au">자동</span>':''}${isTemp(p)?'<span class="tmp">임시 이미지</span>':''}</div><div class="acts"><button class="pub${p.published?' off':''}" data-p="${p.id}">${p.published?'비공개로':'공개하기'}</button>${p.link?`<a href="${esc(p.link)}" target="_blank" rel="noopener noreferrer"><button type="button">원문</button></a>`:''}<button data-c="${p.id}" title="ChatGPT에 붙여넣을 이미지 생성 문구를 복사합니다">프롬프트 복사</button><button data-t="${p.id}">썸네일 교체</button><button data-e="${p.id}">수정</button><button class="del" data-d="${p.id}">삭제</button></div></div>`).join(''):'<p style="color:var(--mute);padding:20px 0">'+(filter==='draft'?'검토 대기 중인 글이 없습니다.':'등록된 글이 없습니다.')+'</p>'}
document.querySelector('.tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;filter=b.dataset.f;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));draw()};

// ---- 폼
function reset(){
  editId=null;thumbBlob=null;$('f').reset();$('date').value=today();$('pub').checked=true;
  $('drop').classList.remove('has');$('prev').removeAttribute('src');$('dropTx').textContent='클릭하거나 이미지를 끌어다 놓기 (jpg·png·webp)';
  $('ft').textContent='새 글 등록';$('save').textContent='등록하기';$('cancel').style.display='none'}
$('drop').onclick=()=>$('file').click();
$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;
  try{thumbBlob=await toBlob(f);$('prev').src=URL.createObjectURL(thumbBlob);$('drop').classList.add('has');$('dropTx').textContent='다른 이미지로 바꾸려면 클릭'}catch(_){toast('이미지를 읽을 수 없습니다.',1)}};
$('f').onsubmit=async e=>{e.preventDefault();const d=fields(),m=check(d);if(m)return toast(m,1);$('save').disabled=true;
  try{
    const cur=editId?posts.find(x=>x.id===editId):null;
    if(thumbBlob){d.thumb=await uploadThumb(thumbBlob);if(cur)await NewsAuth.removeFile(cur.thumb)}
    else if(!cur)d.thumb=DEF;
    if(editId)await NewsAuth.rest('PATCH','posts?id=eq.'+editId,d);else await NewsAuth.rest('POST','posts',d);
    toast(editId?'수정되었습니다.':(d.published?'등록되었습니다.':'비공개(검토 대기)로 저장되었습니다.'));reset();await load()
  }catch(err){toast(err.message,1)}finally{$('save').disabled=false}};
async function replaceThumb(p,f){
  try{const url=await uploadThumb(await toBlob(f));await NewsAuth.rest('PATCH','posts?id=eq.'+p.id,{thumb:url});await NewsAuth.removeFile(p.thumb);toast('썸네일이 교체되었습니다.');await load()}
  catch(err){toast(err.message||'이미지를 읽을 수 없습니다.',1)}}
$('tfile').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f||!thumbTarget)return;const p=posts.find(x=>x.id==thumbTarget);thumbTarget=null;await replaceThumb(p,f)};

// ---- ChatGPT 이미지 생성용 문구 (글 제목·요약·분류로 만든다)
function imgPrompt(p){
  const sum=(p.summary||'').replace(/\s+/g,' ').trim();
  return ['제약 업계(CSO) 뉴스 기사에 쓸 썸네일 이미지 1장을 만들어 주세요.','',
    '[기사 제목] '+p.title,
    sum?'[기사 요약] '+sum:'',
    p.category?'[분류] '+p.category:'','',
    '[스타일] 깔끔한 실사 사진 느낌, 밝고 신뢰감 있는 톤. 짙은 녹색(#003C24)을 포인트 색으로 은은하게 사용. 제약·의료·비즈니스 분위기.',
    '[구도] 기사 내용을 상징하는 장면 하나만, 단순하고 여백 있는 구도. 가로형(4:3에 가깝게), 중요한 대상은 가운데에 배치.',
    '[금지] 글자, 숫자, 로고, 워터마크, 실존 인물이나 특정 기업·제품을 알아볼 수 있는 요소는 넣지 마세요.'].filter((l,i,a)=>l!==''||a[i-1]!=='').join('\n')}
async function copyText(t){
  try{await navigator.clipboard.writeText(t);return true}catch(_){}
  const a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();
  let ok=false;try{ok=document.execCommand('copy')}catch(_){}a.remove();return ok}

// ---- 이미지 끌어다 놓기: 목록의 글 위에 놓으면 썸네일 교체, 새 글 폼의 이미지 칸에 놓으면 첨부
const isImg=f=>f&&/^image\/(jpeg|png|webp)$/.test(f.type);
const hasFiles=e=>e.dataTransfer&&[...(e.dataTransfer.types||[])].includes('Files');
['dragover','drop'].forEach(t=>addEventListener(t,e=>{if(hasFiles(e))e.preventDefault()})); // 빈 곳에 놓아도 브라우저가 이미지를 열어 버리지 않게
$('items').addEventListener('dragover',e=>{if(!hasFiles(e))return;e.preventDefault();const it=e.target.closest('.it');document.querySelectorAll('.it.over').forEach(x=>x!==it&&x.classList.remove('over'));if(it)it.classList.add('over')});
$('items').addEventListener('dragleave',e=>{const it=e.target.closest('.it');if(it&&!it.contains(e.relatedTarget))it.classList.remove('over')});
$('items').addEventListener('drop',async e=>{if(!hasFiles(e))return;e.preventDefault();document.querySelectorAll('.it.over').forEach(x=>x.classList.remove('over'));
  const it=e.target.closest('.it');if(!it)return;const f=e.dataTransfer.files[0];
  if(!isImg(f))return toast('jpg·png·webp 이미지만 놓을 수 있습니다.',1);
  const p=posts.find(x=>x.id==it.dataset.id);if(p)await replaceThumb(p,f)});
$('drop').addEventListener('dragover',e=>{if(!hasFiles(e))return;e.preventDefault();$('drop').classList.add('over')});
$('drop').addEventListener('dragleave',()=>$('drop').classList.remove('over'));
$('drop').addEventListener('drop',async e=>{if(!hasFiles(e))return;e.preventDefault();$('drop').classList.remove('over');const f=e.dataTransfer.files[0];
  if(!isImg(f))return toast('jpg·png·webp 이미지만 놓을 수 있습니다.',1);
  try{thumbBlob=await toBlob(f);$('prev').src=URL.createObjectURL(thumbBlob);$('drop').classList.add('has');$('dropTx').textContent='다른 이미지로 바꾸려면 클릭'}catch(_){toast('이미지를 읽을 수 없습니다.',1)}});

$('items').onclick=async e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.c){const p=posts.find(x=>x.id==b.dataset.c);toast(await copyText(imgPrompt(p))?'이미지 문구를 복사했습니다. ChatGPT에 붙여넣으세요.':'복사하지 못했습니다. 브라우저 권한을 확인해 주세요.',false);return}
  if(b.dataset.t){thumbTarget=b.dataset.t;$('tfile').click();return}
  if(b.dataset.p){const p=posts.find(x=>x.id==b.dataset.p);
    // 자동 등록 글은 '저장한 날'이 아니라 '공개한 날'로 보이도록, 공개하는 순간 날짜를 오늘로 바꾼다(비공개로 돌릴 때는 그대로)
    const pubNow=!p.published,patch={published:pubNow};if(pubNow&&p.auto)patch.date=today();
    try{await NewsAuth.rest('PATCH','posts?id=eq.'+p.id,patch);toast(p.published?'비공개로 바꿨습니다.':(patch.date?'공개했습니다. (날짜: '+patch.date.replace(/-/g,'.')+')':'공개했습니다.'));await load()}catch(err){toast(err.message,1)}return}
  if(b.dataset.e){const p=posts.find(x=>x.id==b.dataset.e);editId=p.id;thumbBlob=null;
    $('title').value=p.title;$('date').value=p.date;$('summary').value=p.summary||'';$('body').value=p.body||'';$('source').value=p.source||'';$('link').value=p.link||'';$('pub').checked=!!p.published;
    $('prev').src=p.thumb||DEF;$('drop').classList.add('has');$('dropTx').textContent='이미지를 바꾸려면 클릭 (안 바꾸면 그대로)';
    $('ft').textContent='글 수정 (#'+p.id+')';$('save').textContent='수정 저장';$('cancel').style.display='';scrollTo({top:0,behavior:'smooth'});return}
  if(b.dataset.d){const p=posts.find(x=>x.id==b.dataset.d);if(!confirm('“'+p.title+'” 글을 삭제할까요?'))return;
    // 삭제한 글이 자동 등록으로 다시 올라오지 않도록 원문 링크·제목을 먼저 기록해 둔다(이미 있으면 무시)
    let noted=true;
    if(p.src_key){try{await NewsAuth.rest('POST','rejected_posts',{src_key:p.src_key,title:p.title},{Prefer:'resolution=ignore-duplicates,return=minimal'})}catch(_){noted=false}}
    try{await NewsAuth.rest('DELETE','posts?id=eq.'+p.id);await NewsAuth.removeFile(p.thumb);
      toast(noted?'삭제되었습니다.':'삭제했지만 재등록 방지 기록은 실패했습니다(SQL 실행 여부 확인).',!noted);if(editId===p.id)reset();await load()}catch(err){toast(err.message,1)}}};
$('cancel').onclick=reset;
enter();
